<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>

    <!-- SuperNova Cosmic Gradient -->
    <linearGradient id="supernovaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#06b6d4"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Core Plasma Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Electric Cyan Glow -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Ambient Halo -->
    <filter id="ambientHalo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="3"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#supernovaGrad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Ambient Cosmic Halo -->
  <circle cx="256" cy="256" r="140" fill="url(#supernovaGrad)" opacity="0.18" filter="url(#ambientHalo)"/>

  <!-- Outer Orbit Rings (Celestial Gyroscope) -->
  <ellipse cx="256" cy="256" rx="195" ry="75" fill="none" stroke="url(#supernovaGrad)" stroke-width="1.5" opacity="0.3" transform="rotate(-30 256 256)"/>
  <ellipse cx="256" cy="256" rx="195" ry="75" fill="none" stroke="url(#supernovaGrad)" stroke-width="1.5" opacity="0.3" transform="rotate(30 256 256)"/>

  <!-- 4-Point Radiant SuperNova Starburst Flare -->
  <g filter="url(#neonGlow)">
    <!-- Vertical Flare Ray -->
    <path d="M 256 70 Q 256 210 210 256 Q 256 210 256 70 Z" fill="url(#coreGrad)" opacity="0.65"/>
    <path d="M 256 442 Q 256 302 302 256 Q 256 302 256 442 Z" fill="url(#coreGrad)" opacity="0.65"/>
    <!-- Horizontal Flare Ray -->
    <path d="M 70 256 Q 210 256 256 302 Q 210 256 70 256 Z" fill="url(#coreGrad)" opacity="0.65"/>
    <path d="M 442 256 Q 302 256 256 210 Q 302 256 442 256 Z" fill="url(#coreGrad)" opacity="0.65"/>
  </g>

  <!-- Diagonal Secondary Micro-Flares -->
  <g opacity="0.4">
    <line x1="150" y1="150" x2="362" y2="362" stroke="url(#supernovaGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="362" y1="150" x2="150" y2="362" stroke="url(#supernovaGrad)" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Central Kinetic "S" Monogram (SuperNova Singularity) -->
  <g filter="url(#neonGlow)">
    <!-- Upper Cyber Blade Arc of 'S' -->
    <path d="M 330 180 
             C 330 135, 290 120, 256 120 
             C 200 120, 168 152, 168 195 
             C 168 245, 230 255, 256 265 
             C 292 278, 310 288, 310 300 
             L 344 286 
             C 344 245, 290 230, 260 220 
             C 222 208, 206 195, 206 178 
             C 206 156, 226 148, 256 148 
             C 285 148, 305 160, 316 180 Z" 
          fill="url(#supernovaGrad)"/>

    <!-- Lower Cyber Blade Arc of 'S' -->
    <path d="M 182 332 
             C 182 377, 222 392, 256 392 
             C 312 392, 344 360, 344 317 
             C 344 267, 282 257, 256 247 
             C 220 234, 202 224, 202 212 
             L 168 226 
             C 168 267, 222 282, 252 292 
             C 290 304, 306 317, 306 334 
             C 306 356, 286 364, 256 364 
             C 227 364, 207 352, 196 332 Z" 
          fill="url(#supernovaGrad)"/>

    <!-- Geometric Hex Diamond Singularity Core -->
    <polygon points="256,224 284,256 256,288 228,256" fill="#ffffff" opacity="0.95"/>
    <circle cx="256" cy="256" r="4.5" fill="#38bdf8"/>
  </g>

  <!-- Orbital Satellites / Quantum Particles -->
  <circle cx="160" cy="180" r="4" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="352" cy="332" r="4" fill="#a855f7" filter="url(#neonGlow)"/>
  <circle cx="360" cy="190" r="2.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="152" cy="322" r="2.5" fill="#ffffff" opacity="0.8"/>
</svg>